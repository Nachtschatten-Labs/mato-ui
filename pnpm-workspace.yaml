# Review lifecycle scripts before enabling them for the new application.
ignoreScripts: true
allowBuilds: {}
strictDepBuilds: true

# Wait at least 24 hours before accepting newly published dependency versions.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Pin patched transitive dependencies, including Miniflare's exact requirements.
overrides:
  # GHSA-68fv-2mgg-jv7q (indexed source-map denial of service).
  source-map-js: 1.2.2
  # GHSA-rgj7-g3m4-5g8c and GHSA-wq5f-xc86-pv6w (libheif and librsvg vulnerabilities).
  'miniflare>sharp': 0.35.5
  # Undici fixes include GHSA-2m5v-pch6-74hx (TLS validation) and GHSA-4w7w-5xrc-9h26 (redirects).
  undici: 7.30.1
  # Seroval deserialization fixes, including GHSA-97r2-qh9m-474h and GHSA-f86p-h4j2-7qgj.
  seroval: 1.6.11
  # GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized constrained collections).
  zod: 4.6.6

# Use the exact pnpm version declared in package.json.
pmOnFail: error
saveExact: true
